[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "gravitational_lensing_toolkit"
version = "1.0.0"
description = "Gravitational Lensing Analysis Toolkit: PINNs, ray tracing, and scientific validation"
readme = "README.md"
requires-python = ">=3.9"
authors = [{ name = "Gravitational Lensing Team" }]
license = { text = "MIT" }
classifiers = [
  "Programming Language :: Python :: 3",
  "License :: OSI Approved :: MIT License",
  "Operating System :: OS Independent",
]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
include = ["*"]
namespaces = false

[project.urls]
Homepage = "https://github.com/nalin1304/Gravitational-Lensing-algorithm"
Issues = "https://github.com/nalin1304/Gravitational-Lensing-algorithm/issues"

[tool.mypy]
python_version = "3.9"
warn_unused_configs = true
show_error_codes = true
pretty = true

[[tool.mypy.overrides]]
module = [
  "benchmarks.*",
]
ignore_errors = true

[[tool.mypy.overrides]]
module = [
  "src.dark_matter.substructure",
  "src.data.real_data_loader",
  "src.lens_models.advanced_profiles",
  "src.lens_models.lens_system",
  "src.lens_models.mass_profiles",
  "src.lens_models.multi_plane",
  "src.ml.augmentation",
  "src.ml",
  "src.ml.__init__",
  "src.ml.nested_sampling",
  "src.ml.neural_ode",
  "src.ml.evaluate",
  "src.ml.performance",
  "src.ml.physics_constrained_loss",
  "src.ml.pinn_models",
  "src.ml.tensorboard_logger",
  "src.ml.train_pinn",
  "src.ml.transfer_learning",
  "src.ml.uncertainty.bayesian_uq",
  "src.optics.geodesic_integration",
  "src.optics.ray_tracing",
  "src.optics.ray_tracing_backends",
  "src.time_delay.cosmography",
  "src.utils.visualization",
  "src.validation.scientific_validator",
]
ignore_errors = true
